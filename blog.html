<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YGD — blog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 6 L60 39 L95 38 L67 59 L79 93 L50 72 L21 92 L33 58 L5 37 L40 39 Z' fill='%23e2d43a' stroke='%23000' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="distress" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5"/>
  </filter>
</svg>
<div class="page">

  <!-- ================= TOP BRAND BAR ================= -->
  <header class="topbar">
    <div class="brand-left">
      <div class="brand-name"><span class="ygd-text">YGD</span><small>the blog.</small></div>
    </div>
    <div class="brand-right">
      <span class="handle-script">@yell0w.god</span>
      <span class="online" id="modeNote">loading…</span>
      <span class="doodle star-top">
        <svg width="34" height="34" viewBox="0 0 100 100"><path d="M50 6 L60 39 L95 38 L67 59 L79 93 L50 72 L21 92 L33 58 L5 37 L40 39 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
      </span>
    </div>
  </header>

  <!-- ================= NAV ================= -->
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="#" id="searchToggle">Search</a>
    <a href="blog.html" class="active">Blog</a>
    <form class="search" onsubmit="return doSearch(event)">
      <input type="text" id="q" placeholder="filter blogs..." aria-label="search blogs">
      <button>go</button>
    </form>
  </nav>

  <!-- ================= BODY ================= -->
  <main class="blog-cols">

    <div class="halftone" style="width:150px;height:150px;right:-10px;top:-10px;"></div>
    <div class="splatter" style="width:130px;height:130px;left:40%;bottom:0;opacity:.35;"></div>
    <span class="doodle" style="left:-16px;top:40%;opacity:.5;">
      <svg width="58" height="58" viewBox="0 0 100 100">
        <g fill="#e2d43a">
          <path d="M50 12 C31 12 18 26 18 44 C18 55 24 63 31 68 L31 78 L42 78 L42 70 L48 70 L48 80 L54 80 L54 70 L60 70 L60 78 L70 78 L70 67 C77 62 82 54 82 44 C82 26 69 12 50 12 Z"/>
          <circle cx="37" cy="44" r="7" fill="#0b0b09"/><circle cx="63" cy="44" r="7" fill="#0b0b09"/>
          <path d="M44 58 l6 -8 6 8 z" fill="#0b0b09"/>
        </g>
      </svg>
    </span>

    <!-- feed -->
    <section id="feed-top">
      <div id="feed">
        <div class="panel"><div class="head">Blog</div>
          <div class="body">loading posts&hellip;</div></div>
      </div>
    </section>

    <!-- the stack navigator -->
    <aside>
      <div class="panel stack" style="position:sticky; top:10px;">
        <div class="head"><i class="ico ico-pin"></i>The Stack</div>
        <div class="body">
          <p class="hint">jump to any entry &darr;</p>
          <ol id="stackList"><li><a href="#">loading&hellip;</a></li></ol>
        </div>
      </div>

      <div class="panel">
        <div class="head">Post something?</div>
        <div class="body" style="color:var(--dim)">
          only the webmaster can post &mdash; that lives at
          <a href="admin.html">/admin</a> <i class="ico ico-lock"></i>
        </div>
      </div>
    </aside>
  </main>

  <div class="wire-divider"></div>

  <footer class="foot">
    <p><a href="index.html">Home</a> · <a href="blog.html">Blog</a> · <a href="admin.html">Admin</a></p>
    <p>YGD &copy; forever · not your average</p>
  </footer>
</div>

<script type="module" src="js/blog.js"></script>
<script>
  document.getElementById('searchToggle').addEventListener('click', function(e){
    e.preventDefault(); document.getElementById('q').focus();
  });
  function doSearch(e){
    e.preventDefault();
    const term = document.getElementById('q').value.toLowerCase().trim();
    document.querySelectorAll('#feed .blog-entry').forEach(function(el){
      const hit = !term || el.textContent.toLowerCase().includes(term);
      el.style.display = hit ? '' : 'none';
    });
    return false;
  }
</script>
</body>
</html>
