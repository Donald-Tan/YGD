<svg xmlns="http://www.w3.org/2000/svg" width="420" height="480" viewBox="0 0 420 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#ff6600" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="420" height="480" fill="url(#bg)"/>
  <rect width="420" height="480" fill="url(#spot)"/>

  <!-- scratches -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5">
    <line x1="30" y1="0" x2="120" y2="480"/>
    <line x1="300" y1="0" x2="360" y2="480"/>
    <line x1="0" y1="120" x2="420" y2="90"/>
  </g>

  <!-- silhouette figure -->
  <g fill="#0c0f1a">
    <!-- shoulders -->
    <path d="M40 480 C60 360 130 320 210 320 C290 320 360 360 380 480 Z"/>
    <!-- neck -->
    <rect x="185" y="270" width="50" height="70" rx="14"/>
    <!-- head -->
    <ellipse cx="210" cy="200" rx="86" ry="100"/>
    <!-- messy grunge hair -->
    <path d="M120 190 C110 90 170 60 210 60 C255 60 305 95 300 190
             C290 150 270 150 262 172 C258 120 232 110 210 112
             C185 112 160 128 158 172 C150 150 128 150 120 190 Z"/>
  </g>

  <!-- rim light on face edge -->
  <path d="M296 200 a86 100 0 0 1 -20 66" fill="none" stroke="#6699ff" stroke-width="4" stroke-opacity="0.6"/>
  <path d="M124 200 a86 100 0 0 0 20 66" fill="none" stroke="#ff2d95" stroke-width="4" stroke-opacity="0.5"/>

  <!-- shades -->
  <g fill="#05070d" stroke="#6699ff" stroke-opacity="0.5" stroke-width="2">
    <rect x="150" y="188" width="48" height="30" rx="6"/>
    <rect x="222" y="188" width="48" height="30" rx="6"/>
    <line x1="198" y1="200" x2="222" y2="200"/>
  </g>
  <rect x="156" y="192" width="14" height="8" fill="#b6ff00" opacity="0.7"/>
  <rect x="228" y="192" width="14" height="8" fill="#b6ff00" opacity="0.7"/>

  <!-- distress overlay -->
  <rect width="420" height="480" filter="url(#grain)" opacity="0.5"/>
  <text x="210" y="452" text-anchor="middle" font-family="monospace" font-size="16"
        fill="#b6ff00" opacity="0.85">// SWAP ME · your.jpg</text>
</svg>
